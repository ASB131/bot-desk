name: bot-desk

services:
  bot:
    image: ghcr.io/asb131/bot-desk:latest
    pull_policy: always
    container_name: bot-desk
    ports:
      - "${PORT:-23435}:${PORT:-23435}"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      PANEL_PASSWORD: ${PANEL_PASSWORD:-}
      PORT: ${PORT:-23435}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('PORT','23435'), timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

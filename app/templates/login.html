<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f0f2f5">
  <title>Log in · Bot desk</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/site-theme.css">
  <script src="/static/site-theme.js" defer></script>
</head>
<body class="login-body">
  <button type="button" id="site-theme-toggle" aria-label="Switch theme"><span aria-hidden="true">◐</span></button>
  <main class="login-card">
    <h1>Bot desk</h1>
    <p class="lede">Log in to manage your Discord bot.</p>
    {% if flash %}
    <p class="flash {{ flash.level }}" role="status">{{ flash.text }}</p>
    {% endif %}
    {% if not password_set %}
    <p class="flash error">Set PANEL_PASSWORD in the .env file and restart the container.</p>
    {% else %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="nxt" value="{{ next }}">
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <button type="submit">Log in</button>
    </form>
    {% endif %}
  </main>
</body>
</html>
